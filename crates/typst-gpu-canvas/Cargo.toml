[package]
name = "typst-gpu-canvas"
version = "0.1.0"
edition = "2024"
description = "Self-contained GPU canvas renderer for typst frames inside egui's wgpu render pass."

[dependencies]
typ-edit-geom = { workspace = true }
typst-library = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
lyon = { workspace = true }
ttf-parser = { workspace = true }
image = { workspace = true, features = ["png"] }
usvg = { workspace = true }
resvg = { workspace = true }

[dev-dependencies]
typst = { workspace = true }
typst-assets = { workspace = true, features = ["fonts"] }
typst-layout = { workspace = true }
typst-render = { workspace = true }
typst-syntax = { workspace = true }
egui_kittest = { workspace = true, features = ["wgpu"] }
dify = { workspace = true }
